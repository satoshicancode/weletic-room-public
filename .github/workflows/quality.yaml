name: Fast Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  DOTENV_FLOW_SILENT: "true"
  DATABASE_URL: "mysql://root:@localhost:3306/planetscale"
  PLANETSCALE_DATABASE_URL: "http://root:unused@localhost:3900/planetscale"
  NEXTAUTH_SECRET: "quality-gate-secret-at-least-32-characters"
  NEXTAUTH_URL: "http://partners.localhost:8888"
  TINYBIRD_API_KEY: "xx"
  TINYBIRD_API_URL: "xx"
  UPSTASH_REDIS_REST_URL: "http://127.0.0.1:8079"
  UPSTASH_REDIS_REST_TOKEN: "quality_srh_token"
  UPSTASH_VECTOR_REST_URL: "https://sensible-camel-xxxx.upstash.io"
  UPSTASH_VECTOR_REST_TOKEN: "xx"
  QSTASH_URL: "https://qstash-us-east-1.upstash.io"
  QSTASH_TOKEN: "xx"
  QSTASH_CURRENT_SIGNING_KEY: "xx"
  QSTASH_NEXT_SIGNING_KEY: "xx"
  CRON_SECRET: "xx"
  ANTHROPIC_API_KEY: "xx"
  STRIPE_SECRET_KEY: "xx"
  STRIPE_WEBHOOK_SECRET: "xx"
  STRIPE_CONNECT_WEBHOOK_SECRET: "xx"
  STRIPE_APP_WEBHOOK_SECRET_TEST: "xx"
  STRIPE_APP_SECRET_KEY_TEST: "xx"
  STRIPE_CONNECT_V2_WEBHOOK_SECRET: "xx"
  STRIPE_APP_SECRET_KEY_SANDBOX: "xx"
  STRIPE_APP_SECRET_KEY: "xx"
  SHOPIFY_API_KEY: "quality-gate-client-id"
  SHOPIFY_API_SECRET: "quality-gate-client-secret"
  SHOPIFY_APP_URL: "https://shopify.example.test"
  WELETIC_API_URL: "https://app.example.test"
  WELETIC_SHOPIFY_SERVICE_SECRET: "quality-gate-service-secret-32-characters"

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.affected.outputs.lint }}
      shopify: ${{ steps.affected.outputs.shopify }}
      unit: ${{ steps.affected.outputs.unit }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate path classifier
        run: node --test .github/scripts/detect-affected.test.mjs

      - name: Classify changed paths
        id: affected
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_MODE: ${{ github.event_name == 'push' && 'direct' || 'merge-base' }}
          CI_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/detect-affected.mjs

  format-lint:
    name: Format and lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: |
          pnpm prettier-check
          pnpm exec prettier --check '.github/**/*.{mjs,yaml,yml}'
      - name: Run root lint
        if: needs.changes.outputs.lint == 'true'
        env:
          SHOPIFY_AFFECTED: ${{ needs.changes.outputs.shopify }}
          WEB_AFFECTED: ${{ needs.changes.outputs.web }}
        run: |
          if [ "$WEB_AFFECTED" = "true" ] && [ "$SHOPIFY_AFFECTED" = "false" ]; then
            pnpm turbo lint --filter=web...
          else
            pnpm lint
          fi

  web-typecheck:
    name: Web type-check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=web^...
      - run: pnpm --filter web prisma:generate
      - run: pnpm --filter web exec tsc --noEmit --pretty false

  shopify-typecheck:
    name: Shopify checks
    needs: changes
    if: needs.changes.outputs.shopify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weletic/shopify-app typecheck
      - run: pnpm --filter weletic-free-product test -- --run

  unit-tests:
    name: Deterministic unit tests
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      QSTASH_TOKEN: ""
      QSTASH_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      UPSTASH_REDIS_REST_URL: ""
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run affected unit tests
        env:
          SHOPIFY_AFFECTED: ${{ needs.changes.outputs.shopify }}
          WEB_AFFECTED: ${{ needs.changes.outputs.web }}
        run: |
          if [ "$WEB_AFFECTED" = "true" ] && [ "$SHOPIFY_AFFECTED" = "false" ]; then
            pnpm turbo test --filter=web...
          else
            pnpm test:unit
          fi

  fast-gate:
    name: Fast quality gate
    if: always()
    needs:
      - changes
      - format-lint
      - shopify-typecheck
      - unit-tests
      - web-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FORMAT_LINT_RESULT: ${{ needs.format-lint.result }}
          SHOPIFY_TYPECHECK_RESULT: ${{ needs.shopify-typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          WEB_TYPECHECK_RESULT: ${{ needs.web-typecheck.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$FORMAT_LINT_RESULT" \
            "$SHOPIFY_TYPECHECK_RESULT" \
            "$UNIT_TESTS_RESULT" \
            "$WEB_TYPECHECK_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Fast quality check failed with result: $result" >&2; exit 1 ;;
            esac
          done
