name: Full Release Gate

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full release validation
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 45
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=8192"
      DOTENV_FLOW_SILENT: "true"
      RUNTIME_CACHE_DISABLE_BUILD_CACHE: "true"
      CI_SEPARATE_VALIDATION: "true"
      DATABASE_URL: "mysql://root:@localhost:3306/planetscale"
      PLANETSCALE_DATABASE_URL: "http://root:unused@localhost:3900/planetscale"

      NEXTAUTH_SECRET: "e2e-test-secret-at-least-32-chars-long"
      NEXTAUTH_URL: "http://partners.localhost:8888"

      E2E_PARTNER_EMAIL: "partner1@dub-internal-test.com"
      E2E_PARTNER_PASSWORD: "password"

      TINYBIRD_API_KEY: "xx"
      TINYBIRD_API_URL: "xx"

      # serverless-redis-http (SRH) — must match jobs.e2e.services.srh env
      SRH_TOKEN: "e2e_srh_token"
      UPSTASH_REDIS_REST_URL: "http://127.0.0.1:8079"
      UPSTASH_REDIS_REST_TOKEN: "e2e_srh_token"
      UPSTASH_VECTOR_REST_URL: "https://sensible-camel-xxxx.upstash.io"
      UPSTASH_VECTOR_REST_TOKEN: "xx"
      QSTASH_URL: "http://127.0.0.1:8090"
      QSTASH_TOKEN: "xx"
      QSTASH_CURRENT_SIGNING_KEY: "xx"
      QSTASH_NEXT_SIGNING_KEY: "xx"

      # RESEND_API_KEY must be unset so emails route through SMTP to MailHog
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_USER: "smtpUser"
      SMTP_PASSWORD: "smtpPassword"

      CRON_SECRET: "xx"
      ANTHROPIC_API_KEY: "xx"

      STRIPE_SECRET_KEY: "xx"
      STRIPE_WEBHOOK_SECRET: "xx"
      STRIPE_CONNECT_WEBHOOK_SECRET: "xx"
      STRIPE_APP_WEBHOOK_SECRET_TEST: "xx"
      STRIPE_APP_SECRET_KEY_TEST: "xx"
      STRIPE_CONNECT_V2_WEBHOOK_SECRET: "xx"
      STRIPE_APP_SECRET_KEY_SANDBOX: "xx"
      STRIPE_APP_SECRET_KEY: "xx"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: planetscale
          MYSQL_ROOT_HOST: "%"
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: "e2e_srh_token"
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    steps:
      - name: Mark full release gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context="Full release gate" \
            -f description="Full release validation is running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Check out code
        uses: actions/checkout@v5

      - name: Pause E2E service containers during builds
        run: |
          docker stop \
            "${{ job.services.srh.id }}" \
            "${{ job.services.mailhog.id }}" \
            "${{ job.services.redis.id }}" \
            "${{ job.services.mysql.id }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium

      - name: Generate Prisma client
        working-directory: apps/web
        run: pnpm prisma:generate

      - name: Build Shopify application
        run: pnpm --filter @weletic/shopify-app build

      - name: Build web dependencies
        run: pnpm turbo build --filter=web^...

      - name: Compile web application
        working-directory: apps/web
        # Private-repository ubuntu-latest runners have 8 GB of RAM. E2E
        # containers remain paused here so the Next worker has stable headroom.
        run: |
          while true; do
            free -h
            df -h .
            sleep 60
          done &
          memory_monitor_pid=$!
          trap 'kill "$memory_monitor_pid" 2>/dev/null || true' EXIT
          NODE_OPTIONS="--max-old-space-size=5120" pnpm exec next build --experimental-build-mode=compile

      - name: Remove transient Webpack cache
        working-directory: apps/web
        run: |
          rm -rf .next/cache
          df -h .

      - name: Resume and verify E2E service containers
        run: |
          mysql_id="${{ job.services.mysql.id }}"
          mailhog_id="${{ job.services.mailhog.id }}"
          redis_id="${{ job.services.redis.id }}"
          srh_id="${{ job.services.srh.id }}"

          docker start "$mysql_id" "$redis_id" "$mailhog_id"

          mysql_ready=false
          redis_ready=false
          for attempt in {1..30}; do
            if docker exec "$mysql_id" mysqladmin ping -h 127.0.0.1 --silent; then
              mysql_ready=true
            fi
            if docker exec "$redis_id" redis-cli ping | grep --quiet PONG; then
              redis_ready=true
            fi
            if [[ "$mysql_ready" == true && "$redis_ready" == true ]]; then
              break
            fi
            sleep 2
          done
          [[ "$mysql_ready" == true ]]
          [[ "$redis_ready" == true ]]

          docker start "$srh_id"

          wait_for_port() {
            local port="$1"
            local label="$2"
            for attempt in {1..30}; do
              if (echo >"/dev/tcp/127.0.0.1/$port") >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $label on port $port" >&2
            return 1
          }

          wait_for_port 1025 "MailHog SMTP"
          wait_for_port 8025 "MailHog HTTP"
          wait_for_port 8079 "serverless-redis-http"

      - name: Start PlanetScale simulator
        run: |
          docker run -d --name ps-http-sim \
            --network host \
            ghcr.io/mattrobenolt/ps-http-sim:latest \
            -listen-addr=0.0.0.0 \
            -listen-port=3900 \
            -mysql-dbname=planetscale \
            -mysql-no-pass \
            -mysql-addr=127.0.0.1

      - name: Push database schema
        working-directory: apps/web
        run: pnpm prisma:push

      - name: Seed test data
        working-directory: apps/web
        run: pnpm tsx playwright/seed.ts

      - name: Start QStash mock
        working-directory: apps/web
        run: |
          nohup pnpm tsx playwright/qstash-mock-server.ts >/tmp/qstash-e2e.log 2>&1 &
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/health

      - name: Generate web application pages
        working-directory: apps/web
        run: NODE_OPTIONS="--max-old-space-size=5120" pnpm exec next build --experimental-build-mode=generate

      - name: Run Playwright tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Publish full release gate status
        if: always()
        env:
          GATE_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$GATE_STATE" \
            -f context="Full release gate" \
            -f description="Full release validation $GATE_STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
